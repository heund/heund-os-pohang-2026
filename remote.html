<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fffaf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HEUND OS · 리모컨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23ffd84a' stroke='%231c1a17' stroke-width='3'/%3E%3Cpath d='M12 10l9 6-9 6z' fill='%231c1a17'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root {
    --ink: #1c1a17; --paper: #fffaf0; --paper-2: #f3ead6; --paper-3: #e4d9c1;
    --yellow: #ffd84a; --green: #3dbb94; --coral: #f6735f; --blue: #74c7f2;
    --shade: rgba(28, 26, 23, .22); --line: 3px;
    --f-sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif;
    --f-px: "Galmuri11", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--paper-2); color: var(--ink); font-family: var(--f-sans); }
  body { overscroll-behavior: none; touch-action: manipulation; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }

  /* ── passphrase ── */
  .gate { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .gate-card { width: 100%; max-width: 420px; padding: 26px 22px 24px; border: var(--line) solid var(--ink); border-radius: 18px; background: var(--paper); box-shadow: 8px 8px 0 var(--shade); }
  .brand { font-family: var(--f-px); font-size: 13px; letter-spacing: .08em; opacity: .6; }
  .gate h1 { margin: 6px 0 20px; font-size: 32px; font-weight: 800; letter-spacing: -.03em; }
  .gate label { display: block; font-size: 15px; font-weight: 700; }
  .gate input[type=password] { width: 100%; margin: 8px 0 14px; padding: 14px 14px; border: var(--line) solid var(--ink); border-radius: 12px; background: #fff; font: 600 20px var(--f-sans); }
  .gate input[type=password]:focus { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .keep { display: flex !important; align-items: center; gap: 8px; margin-bottom: 18px; font-weight: 600 !important; }
  .keep input { width: 20px; height: 20px; accent-color: var(--ink); }
  .gate button { width: 100%; padding: 15px; border: var(--line) solid var(--ink); border-radius: 12px; background: var(--yellow); box-shadow: 4px 4px 0 var(--ink); font-size: 20px; font-weight: 800; }
  .gate button:active { transform: translate(4px, 4px); box-shadow: none; }
  .hint { margin-top: 16px; font-size: 14px; line-height: 1.5; opacity: .7; }

  /* ── remote ── */
  .app { height: 100%; display: flex; flex-direction: column; gap: 10px;
         padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  .now { flex: none; padding: 12px 14px 12px; border: var(--line) solid var(--ink); border-radius: 16px; background: var(--paper); box-shadow: 5px 5px 0 var(--shade); }
  .now-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .count { flex: none; white-space: nowrap; font-family: var(--f-px); font-size: 17px; }
  .count b { font-size: 34px; }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--paper-2); white-space: nowrap; }
  .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #aaa; }
  .status.on::before { background: var(--green); }
  .status.off::before { background: var(--coral); }
  .status.wait::before { background: var(--yellow); }
  .now h1 { margin-top: 4px; font-size: 25px; font-weight: 800; letter-spacing: -.03em; line-height: 1.25; }
  .desc { margin-top: 4px; font-size: 15px; font-weight: 600; line-height: 1.45; opacity: .75; }
  .status { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 2px dashed var(--paper-3); }
  .next { min-width: 0; font-size: 14px; font-weight: 600; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next span { font-weight: 800; }
  /* stopwatch: kept on this phone, survives a locked screen or a reload */
  .timer { flex: none; display: flex; gap: 6px; }
  .timer button { height: 36px; padding: 0 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper-2); font-family: var(--f-px); font-size: 16px; font-weight: 700; }
  .timer #t-toggle { min-width: 96px; }
  .timer.is-running #t-toggle { background: var(--green); color: #fff; }
  .timer #t-reset:disabled { opacity: .3; }
  .warn { flex: none; padding: 10px 12px; border: var(--line) solid var(--ink); border-radius: 12px; background: var(--coral); color: #fff; font-size: 14px; font-weight: 700; line-height: 1.45; }

  .notes { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
           padding: 16px 16px 20px; border: var(--line) solid var(--ink); border-radius: 16px; background: #fff;
           font-size: 19px; font-weight: 500; line-height: 1.65; letter-spacing: -.01em; white-space: pre-wrap; word-break: keep-all; }
  .notes.is-empty { color: rgba(28, 26, 23, .4); font-size: 16px; }

  .controls { flex: none; display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 10px; }
  .ctl { height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
         border: var(--line) solid var(--ink); border-radius: 16px; background: var(--paper); box-shadow: 5px 5px 0 var(--ink);
         font-size: 30px; font-weight: 800; line-height: 1; user-select: none; -webkit-user-select: none; }
  .ctl small { font-size: 14px; font-weight: 700; }
  .ctl:active, .ctl.is-pressed { transform: translate(5px, 5px); box-shadow: none; }
  .ctl-next { background: var(--yellow); }
  .ctl-video { background: var(--blue); }
  .ctl-video small { font-family: var(--f-px); font-size: 12px; }
  .ctl:disabled { background: var(--paper-2); color: rgba(28, 26, 23, .35); box-shadow: 5px 5px 0 rgba(28, 26, 23, .2); }
  .ctl:disabled:active { transform: none; box-shadow: 5px 5px 0 rgba(28, 26, 23, .2); }
  .lock { position: absolute; right: 12px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 104px); padding: 4px 10px;
          border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); font-size: 12px; font-weight: 700; opacity: .55; }
</style>
</head>
<body>

<section id="gate" class="gate">
  <div class="gate-card">
    <p class="brand">HEUND OS · REMOTE</p>
    <h1>리모컨</h1>
    <form id="gate-form" autocomplete="on">
      <label for="pass">비밀번호</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
      <label class="keep"><input id="keep" type="checkbox" checked> 이 휴대폰에서 기억하기</label>
      <button type="submit">연결</button>
      <p class="hint">노트북의 발표 화면에서 <b>R</b>을 눌러 같은 비밀번호를 입력해 두면 연결됩니다.</p>
    </form>
  </div>
</section>

<section id="app" class="app" hidden>
  <header class="now">
    <div class="now-top">
      <span class="count"><b id="cur">--</b> / <span id="last">--</span></span>
      <span id="status" class="status wait">연결 중</span>
    </div>
    <h1 id="label">화면 연결을 기다리는 중</h1>
    <p id="desc" class="desc"></p>
    <div class="foot">
      <p class="next">다음 · <span id="next">—</span></p>
      <div id="timer" class="timer">
        <button id="t-toggle" type="button" aria-label="타이머 시작 / 정지">▶ 0:00</button>
        <button id="t-reset" type="button" aria-label="타이머 초기화" disabled>↺</button>
      </div>
    </div>
  </header>
  <p id="warn" class="warn" hidden>노트북의 발표 화면을 한 번 클릭하거나 키를 눌러 주세요. 그래야 영상 소리가 재생됩니다.</p>
  <article id="notes" class="notes is-empty">노트 없음</article>
  <nav class="controls">
    <button id="b-prev" class="ctl" type="button">◀<small>이전</small></button>
    <button id="b-video" class="ctl ctl-video" type="button" disabled><span id="v-icon">▶</span><small id="v-time">영상 없음</small></button>
    <button id="b-next" class="ctl ctl-next" type="button">▶<small>다음</small></button>
  </nav>
  <button id="b-lock" class="lock" type="button">잠금</button>
</section>

<script src="remote-config.js"></script>
<script src="remote-link.js"></script>
<script src="notes.js"></script>
<script src="remote.js"></script>
</body>
</html>
